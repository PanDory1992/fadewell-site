<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="canonical" href="https://fadewell.eu/shop.html">
  <title>Shop vintage jeans &amp; trousers — FADEWELL</title>
  <meta name="description" content="Browse hand-measured vintage jeans and trousers from FADEWELL, then buy on Vinted.">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="storefront.css">
</head>
<body data-page="shop">
  <header data-site-header></header>
  <main class="shell listing-page">
    <div class="page-title">
      <p class="eyebrow">Available now</p>
      <h1>The wardrobe</h1>
      <p>Filter by the numbers that matter. Every result opens a complete Pair File before Vinted.</p>
    </div>
    <form class="filters" data-filters>
      <label>Search<input name="q" type="search" placeholder="Brand, model, detail"></label>
      <label>Type<select name="type"><option value="">All trousers</option><option value="JEANS">Jeans</option><option value="TROUSERS">Trousers</option></select></label>
      <label>Colour<select name="colour"><option value="">All colours</option></select></label>
      <label>Fit<select name="fit"><option value="">All fits</option></select></label>
      <label>Max waist, flat (cm)<input name="waist" type="number" min="20" max="80" step="0.5" placeholder="e.g. 43"></label>
      <label>Min inseam (cm)<input name="inseam" type="number" min="20" max="130" step="0.5" placeholder="e.g. 78"></label>
      <button class="button small" type="reset">Clear</button>
    </form>
    <div class="result-bar">
      <p data-count>Reading the wardrobe…</p>
      <label>Order<select data-sort><option value="newest">Newest</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="waist">Waist: small to large</option></select></label>
    </div>
    <div class="product-grid" data-products><p class="loading">Reading the wardrobe…</p></div>
  </main>
  <footer data-site-footer></footer>
  <script type="module" src="storefront.js"></script>
</body>
</html>
