name: Build and Deploy Storefront

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 * * * *'
  repository_dispatch:
    types: [storefront-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storefront-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: image-key
        name: Fingerprint the current public galleries
        run: node scripts/image-cache-key.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: fadewell-images-v2-${{ steps.image-key.outputs.key }}
          restore-keys: fadewell-images-v2-
      - run: npm test
      - name: Build indexable Pair Files and responsive images
        run: npm run build
      - id: configure-pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Wait before retrying Pages setup
        if: steps.configure-pages.outcome == 'failure'
        run: sleep 45
      - id: configure-pages-retry
        if: steps.configure-pages.outcome == 'failure'
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Fail after Pages setup retry is exhausted
        if: steps.configure-pages.outcome == 'failure' && steps.configure-pages-retry.outcome == 'failure'
        run: exit 1
      - id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        continue-on-error: true
      - name: Wait before retrying Pages artifact upload
        if: steps.upload-pages-artifact.outcome == 'failure'
        run: sleep 45
      - id: upload-pages-artifact-retry
        if: steps.upload-pages-artifact.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        continue-on-error: true
      - name: Fail after Pages artifact upload retry is exhausted
        if: steps.upload-pages-artifact.outcome == 'failure' && steps.upload-pages-artifact-retry.outcome == 'failure'
        run: exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Fail after Pages deployment retry is exhausted
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: exit 1
