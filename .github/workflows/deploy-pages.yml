name: Build and Deploy Storefront

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 * * * *'
  repository_dispatch:
    types: [storefront-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storefront-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build indexable Pair Files from the live projection
        env:
          # Vinted's CDN remains the gallery source. Avoid downloading and
          # re-encoding every photo during a metadata-only refresh.
          FADEWELL_SKIP_IMAGES: '1'
        run: npm run build
      - id: configure-pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Wait before retrying Pages setup
        if: steps.configure-pages.outcome == 'failure'
        run: sleep 45
      - id: configure-pages-retry
        if: steps.configure-pages.outcome == 'failure'
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Preserve the current site after Pages setup retries
        if: steps.configure-pages.outcome == 'failure' && steps.configure-pages-retry.outcome == 'failure'
        run: echo "::warning title=Pages setup deferred::Both setup attempts failed. The existing Storefront stays live and freshness verification decides whether attention is required."
      - id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        continue-on-error: true
      - name: Wait before retrying Pages artifact upload
        if: steps.upload-pages-artifact.outcome == 'failure'
        run: sleep 45
      - id: upload-pages-artifact-retry
        if: steps.upload-pages-artifact.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
        continue-on-error: true
      - name: Preserve the current site after artifact upload retries
        if: steps.upload-pages-artifact.outcome == 'failure' && steps.upload-pages-artifact-retry.outcome == 'failure'
        run: echo "::warning title=Pages upload deferred::Both upload attempts failed. The existing Storefront stays live and freshness verification decides whether attention is required."
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Preserve the current site after deployment retries
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: echo "::warning title=Pages deployment deferred::Both deployment attempts failed. The existing Storefront stays live and freshness verification decides whether attention is required."
      - name: Verify live and static Storefront freshness
        run: node scripts/verify-live-storefront.mjs 90
